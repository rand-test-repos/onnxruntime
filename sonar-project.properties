sonar.organization=rand-test-repos
sonar.projectKey=onnxruntime
sonar.projectName=onnxruntime
sonar.sourceEncoding=UTF-8

# C/C++ (cpp/cxx analysis needs a compile_commands.json; generate it with
# ./fix_macos_sdk_and_configure.sh --config Release --update --build_dir build/sonar)
sonar.cfamily.compile-commands=build/sonar/Release/compile_commands.json

sonar.sources=onnxruntime,orttraining,include,csharp,java,js,objectivec,rust,winml
sonar.tests=onnxruntime/test,orttraining/orttraining/test,csharp/test,java/src/test,js/common/test,js/node/test,js/web/test,js/react_native/e2e

sonar.exclusions=\
  **/build/**,\
  **/build_*/**,\
  **/node_modules/**,\
  **/cmake/external/**,\
  **/*.pb.cc,**/*.pb.h,\
  **/*_pb2.py,\
  **/third_party/**,\
  **/.venv/**,\
  onnxruntime/test/**,\
  orttraining/orttraining/test/**,\
  csharp/test/**,\
  java/src/test/**,\
  js/common/test/**,\
  js/node/test/**,\
  js/web/test/**,\
  js/react_native/e2e/**

sonar.coverage.exclusions=\
  **/test/**,\
  **/tests/**

sonar.python.version=3.10,3.11,3.12,3.13
